<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>四季小劇場｜課文情景互動</title>
<meta name="description" content="跟著課文《四季》走進春夏秋冬，點一點、聽一聽，收集四季徽章，最後聽全文普通話朗讀。">
<style>
  :root{
    --ink:#4A3B33;
    --cream:#FFF9EE;
    --spring:#74C465;
    --summer:#45B4D6;
    --autumn:#F0A63C;
    --winter:#7E9BD1;
    --muted:#8A7360;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:#FFE9C9;
    background-image:
      radial-gradient(circle at 10% 6%, #FFD8A6 0, rgba(255,216,166,0) 42%),
      radial-gradient(circle at 92% 94%, #C9E8FF 0, rgba(201,232,255,0) 44%);
    color:var(--ink);
    font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font-family:inherit;color:inherit}
  #app{
    width:100%;max-width:460px;min-height:100dvh;background:var(--cream);
    position:relative;display:flex;flex-direction:column;overflow:hidden;
  }
  @media (min-width:600px){
    #app{min-height:calc(100dvh - 40px);margin:20px 0;border-radius:34px;box-shadow:0 0 0 4px var(--ink),0 22px 48px rgba(74,59,51,.22)}
  }
  .screen{
    display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;
    padding:0 16px calc(18px + env(safe-area-inset-bottom));
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none}
  .screen.active{display:flex}

  /* ---------- 首頁 ---------- */
  .home-top{padding:24px 4px 6px;text-align:center}
  .home-kicker{
    display:inline-block;font-size:11px;letter-spacing:2px;font-weight:800;color:var(--muted);
    background:#FFF1D8;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;
  }
  .home-title{margin:14px 0 0;font-size:46px;line-height:1;font-weight:900;letter-spacing:2px;color:#FF8A5B;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(74,59,51,.13)}
  .home-title .t2{display:block;font-size:24px;letter-spacing:10px;color:var(--ink);text-shadow:none;margin-top:10px;padding-left:10px}
  .home-sub{margin:12px 0 0;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px}
  .map-head{margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}
  .map-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .season-card{
    position:relative;border:3px solid var(--ink);border-radius:24px;background:var(--bg);
    padding:8px 8px 11px;text-align:left;cursor:pointer;overflow:hidden;
    box-shadow:0 5px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;
  }
  .season-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .sc-illus{height:84px;display:flex;align-items:center;justify-content:center}
  .sc-illus svg{width:100%;height:100%;display:block}
  .sc-name{display:block;font-size:17px;font-weight:900;line-height:1.15;margin-top:2px}
  .sc-line{display:block;font-size:11px;color:#7A6553;margin-top:3px;font-weight:700;letter-spacing:.5px}
  .sc-tag{position:absolute;top:9px;left:9px;font-size:11px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:9px;padding:1px 7px;z-index:2}
  .sc-star{position:absolute;top:7px;right:9px;font-size:17px;line-height:1;color:rgba(74,59,51,.22);z-index:2}
  .season-card.done .sc-star{color:#FFC93C;text-shadow:0 1px 0 #fff}
  .season-card.done{box-shadow:0 5px 0 var(--ink),inset 0 0 0 4px rgba(255,255,255,.6)}
  .home-foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
  .primary-btn{
    width:100%;border:3px solid var(--ink);border-radius:18px;background:#FFD86B;padding:14px;
    font-size:17px;font-weight:900;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 5px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;
  }
  .primary-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .primary-btn.ghost{background:#fff}
  .text-btn{background:none;border:0;font-size:12px;color:var(--muted);font-weight:700;padding:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .all-done{
    margin-top:14px;border:3px dashed var(--ink);border-radius:20px;padding:12px 14px;background:#FFF3C9;
    font-size:13px;font-weight:800;line-height:1.6;text-align:center;
  }

  /* ---------- 關卡頁 ---------- */
  .level-head{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex:0 0 auto}
  .icon-btn{
    width:42px;height:42px;flex:0 0 42px;border-radius:14px;border:3px solid var(--ink);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 var(--ink);
    transition:transform .1s ease,box-shadow .1s ease;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
  .icon-btn svg{width:20px;height:20px;display:block}
  .icon-btn.off{opacity:.42}
  .season-pill{
    margin:0 auto;font-size:15px;font-weight:900;letter-spacing:2px;padding:7px 20px;border-radius:999px;
    border:3px solid var(--ink);background:#fff;
  }
  .level-body{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding-bottom:2px}
  .scene-card{
    border:3px solid var(--ink);border-radius:26px;overflow:hidden;background:#fff;
    box-shadow:0 5px 0 rgba(74,59,51,.16);flex:0 0 auto;position:relative;
  }
  .scene-svg{display:block;width:100%;height:auto}
  .scene-svg text{font-family:inherit}
  .hint-bar{
    margin:10px 0 0;font-size:13px;font-weight:700;color:var(--muted);text-align:center;
    min-height:20px;line-height:1.5;
  }
  .task-panel{
    margin-top:10px;background:#fff;border:3px solid var(--ink);border-radius:22px;
    padding:14px 14px 16px;box-shadow:0 5px 0 rgba(74,59,51,.12);min-height:132px;
  }
  .task-q{margin:0;font-size:16px;font-weight:900;line-height:1.55}
  .task-desc{margin:6px 0 14px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.6}
  .task-panel .primary-btn{margin-top:2px}
  .options{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .opt{
    width:100%;text-align:left;padding:12px 15px;border:3px solid var(--ink);border-radius:16px;
    background:#FFF7E6;font-size:16px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 0 var(--ink);transition:transform .1s ease,box-shadow .1s ease,background .15s;
  }
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .opt.correct{background:#DFF6D0}
  .opt.wrong{background:#FFDCDC;animation:shakeX .38s ease}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
  .opt:disabled{cursor:default;opacity:.62}
  .sentence-card{
    margin-top:10px;display:flex;align-items:center;gap:10px;background:#fff;
    border:3px solid var(--ink);border-radius:20px;padding:10px 12px;
    box-shadow:0 4px 0 rgba(74,59,51,.12);
  }
  .sent-tag{
    flex:0 0 auto;align-self:flex-start;margin-top:2px;font-size:10px;font-weight:900;letter-spacing:1px;
    color:#FFF9EE;background:var(--ink);border-radius:8px;padding:3px 7px;
  }
  .sent-text{flex:1;min-width:0;margin:0;font-size:13.5px;line-height:1.65;font-weight:700;letter-spacing:.3px}
  .listen-btn{
    flex:0 0 44px;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#FFF1D8;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 var(--ink);
  }
  .listen-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

  /* ---------- 完成彈層 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(74,59,51,.48);
    display:flex;align-items:center;justify-content:center;padding:22px;
  }
  .overlay[hidden]{display:none}
  .badge-card{
    width:100%;max-width:330px;background:var(--cream);border:3px solid var(--ink);border-radius:30px;
    padding:22px 20px 20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.18);
    animation:cardIn .34s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn{from{transform:scale(.86) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .badge-ring{
    width:104px;height:104px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;background:#fff;
    box-shadow:0 0 0 6px rgba(255,216,107,.55);animation:bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .badge-ring svg{width:78px;height:78px}
  .badge-kicker{margin:0;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted)}
  .badge-title{margin:6px 0 8px;font-size:23px;font-weight:900;letter-spacing:1px}
  .badge-line{margin:0 0 18px;font-size:13px;line-height:1.7;color:#6E5A48;font-weight:600}
  .badge-actions{display:flex;flex-direction:column;gap:9px}

  /* ---------- 朗讀頁 ---------- */
  .read-head{padding:6px 4px 14px;text-align:center}
  .read-head h2{margin:0;font-size:30px;font-weight:900;letter-spacing:6px}
  .read-head p{margin:8px 0 0;font-size:12px;color:var(--muted);font-weight:600}
  .line-list{display:flex;flex-direction:column;gap:10px}
  .line-card{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:#fff;border:3px solid var(--ink);border-radius:20px;padding:13px 14px;
    font-size:17px;line-height:1.75;font-weight:700;cursor:pointer;
    box-shadow:0 4px 0 rgba(74,59,51,.16);transition:background .18s,transform .12s;
  }
  .line-card:active{transform:translateY(3px)}
  .line-no{
    flex:0 0 24px;height:24px;border-radius:50%;border:2.5px solid var(--ink);background:#FFF1D8;
    font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:3px;
  }
  .line-text{flex:1;min-width:0}
  .line-card.on{background:#FFF3C9;box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px #FFD86B}
  .line-card.on .line-no{background:#FFD86B}
  .read-actions{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .read-tip{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted);font-weight:600;line-height:1.6;min-height:18px}

  /* ---------- SVG 動畫 ---------- */
  .hot{cursor:pointer}
  .hot:active{opacity:.86}
  .pulse{animation:pulseRing 1.9s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulseRing{0%{transform:scale(.72);opacity:.9}70%{transform:scale(1.06);opacity:0}100%{opacity:0}}
  .pop-in{animation:popIn .58s cubic-bezier(.34,1.56,.64,1) both;transform-box:view-box;transform-origin:180px 250px}
  @keyframes popIn{0%{transform:scale(.55,.7);opacity:0}65%{transform:scale(1.04,1.03);opacity:1}100%{transform:scale(1,1);opacity:1}}
  .bird-in{animation:flyIn .7s cubic-bezier(.22,1,.36,1) both}
  @keyframes flyIn{0%{transform:translate(70px,-46px);opacity:0}100%{transform:translate(0,0);opacity:1}}
  .bubble-in{animation:bubbleIn .45s cubic-bezier(.34,1.56,.64,1) both;transform-box:view-box;transform-origin:180px 70px}
  @keyframes bubbleIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .hop-in{animation:hopIn .72s cubic-bezier(.3,1.2,.5,1) both}
  @keyframes hopIn{0%{transform:translate(112px,-16px) scale(.9)}55%{transform:translate(52px,-52px) scale(1.02)}100%{transform:translate(0,0) scale(1)}}
  .bend{animation:bendDown .8s cubic-bezier(.34,1.4,.64,1) both;transform-box:view-box;transform-origin:150px 244px}
  @keyframes bendDown{0%{transform:rotate(0deg)}100%{transform:rotate(-26deg)}}
  .leaf-fall{animation:leafFall 2.6s ease-in-out infinite}
  @keyframes leafFall{0%{transform:translate(0,-6px) rotate(0)}50%{transform:translate(-6px,8px) rotate(18deg)}100%{transform:translate(0,-6px) rotate(0)}}
  .tummy{animation:tummyPuff .7s cubic-bezier(.34,1.56,.64,1) both;transform-box:view-box;transform-origin:180px 232px}
  @keyframes tummyPuff{0%{transform:scale(1,1)}45%{transform:scale(1.07,1.1)}100%{transform:scale(1,1)}}
  .snowfall{animation:snowDrop 4s linear infinite}
  @keyframes snowDrop{0%{transform:translateY(-6px);opacity:.2}50%{opacity:1}100%{transform:translateY(10px);opacity:.2}}
  .sway{animation:sway 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:180px 250px}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}

  @media (prefers-reduced-motion: reduce){
    .pulse,.bob,.leaf-fall,.snowfall,.sway{animation:none}
  }
</style>
</head>

  var MINIS = { spring: miniSpring, summer: miniSummer, autumn: miniAutumn, winter: miniWinter };

  function renderHome() {
    var grid = $('#mapGrid');
    var html = '';
    SEASONS.forEach(function (s) {
      var done = !!state.progress[s.id];
      html += '<button class="season-card' + (done ? ' done' : '') + '" data-level="' + s.id + '" ' +
        'style="--bg:' + s.bg + '" aria-label="進入' + s.name + '關卡">' +
        '<span class="sc-tag" style="color:' + s.color + '">' + s.tag + '</span>' +
        '<span class="sc-star">★</span>' +
        '<span class="sc-illus">' + MINIS[s.id]() + '</span>' +
        '<span class="sc-name">' + s.name + '</span>' +
        '<span class="sc-line">' + s.line + '</span>' +
        '</button>';
    });
    grid.innerHTML = html;

    $('#progressText').textContent = doneCount() + ' / 4 枚徽章';

    var box = $('#allDoneBox');
    if (doneCount() === 4) {
      box.innerHTML = '<div class="all-done">四季小達人！四個季節都收集完成，<br>去聽一聽全文朗讀吧。</div>';
    } else {
      box.innerHTML = '';
    }

  }

  /* ================= 畫面切換 ================= */

  function showScreen(name) {
    state.screen = name;
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].classList.toggle('active', screens[i].id === 'screen-' + name);
    }
    var app = $('#app');
    if (app) {
      var act = document.querySelector('.screen.active');
      if (act) act.scrollTop = 0;
    }
    if (name !== 'level') {
      stopSpeaking();
      stopReading();
    }
  }

  /* ================= 關卡 ================= */

  function openLevel(id) {
    if (!LEVELS[id]) return;
    unlockAudio();
    state.level = id;
    state.acted = false;
    state.answered = false;

    var s = SEASONS.filter(function (x) { return x.id === id; })[0];
    var pill = $('#seasonPill');
    pill.textContent = s.name;
    pill.style.background = s.bg;
    pill.style.borderColor = s.color;

    $('#hintBar').textContent = '';
    $('#overlay').hidden = true;
    renderLevel();
    showScreen('level');
  }

  function renderLevel() {
    var id = state.level;
    if (!id) return;
    var L = LEVELS[id];

    $('#sceneWrap').innerHTML = SCENES[id](state.acted);
    $('#sentText').textContent = L.sentence;

    var panel = $('#taskPanel');
    if (!state.acted) {
      panel.innerHTML =
        '<p class="task-q">' + esc(L.actTitle) + '</p>' +
        '<p class="task-desc">' + esc(L.actDesc) + '</p>' +
        '<button class="primary-btn" id="actBtn">' + esc(L.actBtn) + '</button>';
      var actBtn = $('#actBtn');
      if (actBtn) actBtn.addEventListener('click', doAction);
    } else {
      panel.innerHTML =
        '<p class="task-q">' + esc(L.question) + '</p>' +
        '<div class="options" id="options">' +
        L.options.map(function (o, i) {
          return '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>';
        }).join('') +
        '</div>';
      var opts = panel.querySelectorAll('.opt');
      for (var i = 0; i < opts.length; i++) {
        opts[i].addEventListener('click', function () {
          answer(parseInt(this.getAttribute('data-i'), 10));
        });
      }
    }
  }

  function doAction() {
    if (!state.level || state.acted) return;
    var id = state.level;
    var L = LEVELS[id];
    state.acted = true;

    unlockAudio();
    sfx(L.sfx);
    renderLevel();
    speakLine(L.tts);
    setTip('聽一聽句子，再回答下面的問題。');
  }

  function answer(i) {
    var L = LEVELS[state.level];
    if (!L || state.answered) return;
    var buttons = document.querySelectorAll('#options .opt');
    if (!buttons.length) return;

    if (i === L.answer) {
      state.answered = true;
      buttons[i].classList.add('correct');
      for (var k = 0; k < buttons.length; k++) { buttons[k].disabled = true; }
      sfx('correct');
      setTip('答對了！' + L.tip);
      speakLine(L.tts);
      setTimeout(function () { completeLevel(); }, 760);
    } else {
      buttons[i].classList.add('wrong');
      sfx('wrong');
      setTip('再想一想，聽一聽句子裡是怎麼說的。');
      setTimeout(function () { buttons[i].classList.remove('wrong'); }, 480);
    }
  }

  function completeLevel() {
    var id = state.level;
    if (!id) return;
    var L = LEVELS[id];
    var s = SEASONS.filter(function (x) { return x.id === id; })[0];

    state.progress[id] = true;
    saveProgress();

    $('#badgeRing').innerHTML = MINIS[id]();
    $('#badgeKicker').textContent = s.name + ' · 完成';
    $('#badgeTitle').textContent = L.badge;
    $('#badgeLine').textContent = L.sentence;

    var idx = ['spring', 'summer', 'autumn', 'winter'].indexOf(id);
    var next = ['spring', 'summer', 'autumn', 'winter'][idx + 1];
    var nextBtn = $('#nextBtn');
    if (next) {
      nextBtn.textContent = '下一關：' + SEASONS.filter(function (x) { return x.id === next; })[0].name;
      nextBtn.setAttribute('data-next', next);
    } else {
      nextBtn.textContent = '去聽全文朗讀';
      nextBtn.setAttribute('data-next', 'read');
    }

    $('#overlay').hidden = false;
    sfx('unlock');
    renderHome();
  }

  /* ================= 朗讀頁 ================= */

  var readIdx = 0;
  var reading = false;

  function renderLines() {
    var list = $('#lineList');
    var html = '';
    LINES.forEach(function (line, i) {
      var s = SEASONS.filter(function (x) { return x.id === line.season; })[0];
      html += '<button class="line-card" data-i="' + i + '" style="--c:' + s.color + '">' +
        '<span class="line-no">' + (i + 1) + '</span>' +
        '<span class="line-text">' + esc(line.text) + '</span>' +
        '</button>';
    });
    list.innerHTML = html;
    var cards = list.querySelectorAll('.line-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function () {
        var idx = parseInt(this.getAttribute('data-i'), 10);
        stopReading();
        highlightLine(idx);
        unlockAudio();
        speakLine(LINES[idx].tts);
        setReadTip('正在朗讀第 ' + (idx + 1) + ' 句');
      });
    }
  }

  function highlightLine(idx) {
    var cards = document.querySelectorAll('.line-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle('on', i === idx);
    }
    if (cards[idx] && cards[idx].scrollIntoView) {
      cards[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function clearHighlight() {
    var cards = document.querySelectorAll('.line-card');
    for (var i = 0; i < cards.length; i++) { cards[i].classList.remove('on'); }
  }

  function updatePlayBtn() {
    var btn = $('#playAll');
    if (!btn) return;
    btn.textContent = reading ? '停止朗讀' : '開始朗讀';
  }

  function playAll() {
    if (reading) { stopReading(); return; }
    if (!canSpeak()) {
      setReadTip('這個瀏覽器不支援語音朗讀，可以跟著文字讀一讀。');
      return;
    }
    unlockAudio();
    reading = true;
    readIdx = 0;
    updatePlayBtn();
    setReadTip('正在朗讀全文⋯⋯');
    speakIndex();
  }

  function speakIndex() {
    if (!reading) return;
    if (readIdx >= LINES.length) {
      stopReading();
      setReadTip('朗讀完了，你也可以自己讀一遍。');
      return;
    }
    highlightLine(readIdx);
    try {
      var u = new SpeechSynthesisUtterance(LINES[readIdx].tts);
      u.lang = 'zh-CN';
      u.rate = 0.82;
      u.pitch = 1.08;
      var v = pickVoice();
      if (v) { u.voice = v; }
      u.onend = function () {
        if (!reading) return;
        readIdx += 1;
        setTimeout(speakIndex, 280);
      };
      u.onerror = function () {
        if (!reading) return;
        stopReading();
        setReadTip('語音朗讀中斷了，可以再按一次開始朗讀。');
      };
      window.speechSynthesis.speak(u);
    } catch (e) {
      stopReading();
      setReadTip('語音朗讀暫時無法使用。');
    }
  }

  function stopReading() {
    reading = false;
    updatePlayBtn();
    stopSpeaking();
  }

  function stopAll() {
    stopReading();
  }

  /* ================= 事件綁定 ================= */

  loadProgress();

  $('#mapGrid').addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.season-card') : null;
    if (card) { openLevel(card.getAttribute('data-level')); }
  });

  $('#backHome').addEventListener('click', function () {
    stopSpeaking();
    $('#overlay').hidden = true;
    showScreen('home');
    renderHome();
  });

  $('#readBtn').addEventListener('click', function () {
    unlockAudio();
    renderLines();
    clearHighlight();
    updatePlayBtn();
    setReadTip('');
    showScreen('read');
  });

  $('#readBack').addEventListener('click', function () {
    stopReading();
    clearHighlight();
    showScreen('home');
    renderHome();
  });

  $('#playAll').addEventListener('click', function () {
    playAll();
  });

  $('#replayBtn').addEventListener('click', function () {
    if (!state.level) return;
    unlockAudio();
    sfx('tap');
    speakLine(LEVELS[state.level].tts);
    setTip('再聽一次，跟著讀一讀。');
  });

  $('#sceneWrap').addEventListener('click', function (e) {
    var hot = e.target.closest ? e.target.closest('.hot') : null;
    if (hot) { doAction(); }
  });

  $('#soundBtn').addEventListener('click', function () {
    toggleSound(this);
  });
  $('#readSound').addEventListener('click', function () {
    toggleSound(this);
  });

  function toggleSound(btn) {
    soundOn = !soundOn;
    if (master) { master.gain.value = soundOn ? 0.5 : 0; }
    btn.classList.toggle('off', !soundOn);
    if (soundOn) { unlockAudio(); sfx('tap'); }
  }

  $('#overlayHome').addEventListener('click', function () {
    $('#overlay').hidden = true;
    showScreen('home');
    renderHome();
  });

  $('#nextBtn').addEventListener('click', function () {
    var next = this.getAttribute('data-next');
    $('#overlay').hidden = true;
    if (next === 'read') {
      renderLines();
      clearHighlight();
      updatePlayBtn();
      setReadTip('');
      showScreen('read');
      setTimeout(function () { speakLine(LINES[0].tts); }, 320);
    } else if (next) {
      openLevel(next);
    } else {
      showScreen('home');
      renderHome();
    }
  });

  var resetArmed = false;
  var resetTimer = null;
  $('#resetBtn').addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true;
      this.textContent = '再點一次，確認清除進度';
      var self = this;
      resetTimer = setTimeout(function () {
        resetArmed = false;
        self.textContent = '清除進度';
      }, 3200);
      return;
    }
    if (resetTimer) clearTimeout(resetTimer);
    resetArmed = false;
    this.textContent = '清除進度';
    state.progress = { spring: false, summer: false, autumn: false, winter: false };
    saveProgress();
    renderHome();
  });

  window.addEventListener('resize', function () {
    // 佈局由 CSS 自適應，這裡只同步一次目前畫面
    if (state.screen === 'home') { renderHome(); }
  });

  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // 首次手勢解鎖音訊
  document.addEventListener('pointerdown', function once() {
    unlockAudio();
    document.removeEventListener('pointerdown', once);
  }, { once: true });

  renderHome();

  window.addEventListener('beforeunload', function () {
    stopSpeaking();
  });
})();
</script>
</body>
</html>
